    function Badge({ children, className = "" }) {
      return <span className={`inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold ring-1 ring-inset ${className}`}>{children}</span>;
    }

    function getStepAction(request, idx) {
      const step = request.timeline[idx];
      if (step.state === "done") {
        return { type: "info", message: `Đã hoàn thành`, time: step.time };
      }

      let nextAllowedIdx = -1;
      let actionLabel = "";

      if (request.status === "Mới tiếp nhận") {
        nextAllowedIdx = 1;
        actionLabel = "Bắt đầu khảo sát";
      } else if (request.status === "Đang khảo sát") {
        nextAllowedIdx = 2;
        actionLabel = "Đề xuất giải pháp";
      } else if (request.status === "Chờ phê duyệt") {
        const deXuatActive = request.timeline.some(s => s.label === "Đề xuất giải pháp" && s.state === "active");
        if (deXuatActive) {
          nextAllowedIdx = 3;
          actionLabel = "Phê duyệt giải pháp";
        } else {
          nextAllowedIdx = 4;
          actionLabel = "Bắt đầu triển khai";
        }
      } else if (request.status === "Đang triển khai") {
        nextAllowedIdx = 5;
        actionLabel = "Hoàn tất yêu cầu (Đóng)";
      }

      if (idx === nextAllowedIdx) {
        return { type: "action", label: actionLabel };
      }

      if (step.state === "active") {
        return { type: "info", message: "Đang thực hiện", time: step.time };
      }

      return { type: "disabled", message: "Chưa đến bước này" };
    }

    function getNextAction(request) {
      if (request.status === "Mới tiếp nhận") {
        return { label: "Bắt đầu khảo sát", nextStatus: "Đang khảo sát" };
      }
      if (request.status === "Đang khảo sát") {
        return { label: "Đề xuất giải pháp", nextStatus: "Chờ phê duyệt" };
      }
      if (request.status === "Chờ phê duyệt") {
        const deXuatActive = request.timeline.some(s => s.label === "Đề xuất giải pháp" && s.state === "active");
        if (deXuatActive || request.timeline.some(s => s.label === "Đề xuất giải pháp" && s.state === "todo")) {
          return { label: "Phê duyệt giải pháp", nextStatus: "Chờ phê duyệt" };
        }
        return { label: "Bắt đầu triển khai", nextStatus: "Đang triển khai" };
      }
      if (request.status === "Đang triển khai") {
        return { label: "Hoàn tất yêu cầu (Đóng)", nextStatus: "Đã đóng" };
      }
      return null;
    }

    function TimelineMini({ timeline, request, onAdvance }) {
      const [activeIdx, setActiveIdx] = useState(null);

      useEffect(() => {
        if (activeIdx === null) return;
        const handleClose = () => setActiveIdx(null);
        window.addEventListener("click", handleClose);
        return () => window.removeEventListener("click", handleClose);
      }, [activeIdx]);

      return (
        <div className="mt-4 grid grid-cols-6 gap-1 border-t border-slate-100 pt-3 relative">
          {timeline.map((step, idx) => {
            const isDone = step.state === "done";
            const isActive = step.state === "active";
            
            let dateStr = "";
            if (step.time) {
              const match = step.time.match(/(\d{2})\/(\d{2})\/(\d{4})\s*(\d{2}:\d{2})?/);
              if (match) {
                const [, d, m, , time] = match;
                dateStr = time ? `${d}/${m} ${time}` : `${d}/${m}`;
              } else {
                dateStr = step.time.replace("Bắt đầu ", "").replace("Hoàn tất ", "").substring(0, 10);
              }
            }

            const shortLabels = {
              "Tiếp nhận yêu cầu": "Bắt đầu",
              "Khảo sát": "Khảo sát",
              "Đề xuất giải pháp": "Đề xuất",
              "Phê duyệt giải pháp": "Phê duyệt",
              "Triển khai": "Triển khai",
              "Đóng yêu cầu": "Kết thúc",
              "Kết thúc": "Kết thúc",
            };
            const label = shortLabels[step.label] || step.label;
            const stepAction = getStepAction(request, idx);
            const isOpen = activeIdx === idx;

            return (
              <div 
                key={step.label} 
                className="relative flex flex-col items-center text-center cursor-pointer"
                onClick={(e) => {
                  e.stopPropagation();
                  setActiveIdx(isOpen ? null : idx);
                }}
              >
                <div className="relative flex w-full items-center justify-center">
                  <div className={`absolute left-0 right-1/2 top-1.5 h-0.5 -translate-y-1/2 ${idx === 0 ? "invisible" : (isDone || isActive ? "bg-emerald-500" : "bg-slate-200")}`} />
                  <div className={`absolute left-1/2 right-0 top-1.5 h-0.5 -translate-y-1/2 ${idx === timeline.length - 1 ? "invisible" : (isDone ? "bg-emerald-500" : "bg-slate-200")}`} />
                  <div className={`relative z-10 h-3 w-3 rounded-full border-2 transition-all duration-205 ${
                    isDone 
                      ? "bg-emerald-500 border-emerald-500" 
                      : isActive 
                        ? "bg-blue-600 border-blue-600 ring-2 ring-blue-100" 
                        : "bg-white border-slate-300 hover:border-blue-400"
                  }`} />
                </div>
                <span className={`mt-1.5 block text-[10px] font-bold leading-tight ${isActive ? "text-blue-600" : isDone ? "text-slate-800" : "text-slate-400"}`}>
                  {label}
                </span>
                <span className="mt-0.5 block text-[9px] text-slate-500 leading-none min-h-[9px]">
                  {dateStr || "-"}
                </span>

                {isOpen && (
                  <div
                    onClick={(e) => e.stopPropagation()}
                    className="absolute bottom-12 left-1/2 z-40 w-52 -translate-x-1/2 rounded-xl border border-slate-100 bg-white p-3 shadow-xl text-left transition-all duration-200"
                  >
                    <div className="absolute -bottom-1.5 left-1/2 h-3 w-3 -translate-x-1/2 rotate-45 border-b border-r border-slate-100 bg-white" />
                    
                    <div className="text-xs">
                      <p className="font-bold text-slate-900 mb-1">{step.label}</p>
                      {stepAction.type === "info" && (
                        <div className="space-y-1">
                          <span className="inline-flex items-center gap-1 rounded bg-slate-50 px-1.5 py-0.5 text-[10px] font-medium text-slate-600">
                            {stepAction.message}
                          </span>
                          {stepAction.time && <p className="text-[10px] text-slate-500 mt-1">{stepAction.time}</p>}
                          {step.comment && (
                            <p className="text-[9px] text-slate-600 bg-slate-50 p-1.5 rounded-lg border border-slate-100 mt-1 whitespace-pre-line leading-relaxed max-h-20 overflow-y-auto">
                              {step.comment}
                            </p>
                          )}
                        </div>
                      )}

                      {stepAction.type === "disabled" && (
                        <p className="text-[10px] text-slate-400 italic">{stepAction.message}</p>
                      )}

                      {stepAction.type === "action" && (
                        <div className="mt-2">
                          <p className="text-[10px] text-slate-500 mb-2">Bước tiếp theo cần xử lý</p>
                          <button
                            onClick={() => {
                              onAdvance(request.id, stepAction.label);
                              setActiveIdx(null);
                            }}
                            className="w-full rounded-lg bg-blue-600 py-1.5 text-center font-bold text-white shadow-sm hover:bg-blue-700 transition"
                          >
                            {stepAction.label}
                          </button>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );
    }

        <header className={`flex items-center justify-between border-b border-slate-100 bg-white ${compact ? "px-4 py-4" : "px-7 py-5"}`}>
          <div>

    function RequestCard({ request, onOpen, onAdvance }) {

              <p className="text-xs font-semibold text-blue-600">{request.id} · {request.project}</p>

    function Timeline({ timeline }) {
      return (
        <div className="space-y-1">
          {timeline.map((step, index) => {
            const isDone = step.state === "done";
            const isActive = step.state === "active";
            const isTodo = step.state === "todo";

            return (
              <div key={step.label} className="flex gap-3">
                <div className="flex w-7 flex-col items-center">
                  <div className={`flex h-7 w-7 items-center justify-center rounded-full text-xs transition-all duration-200 ${
                    isDone 
                      ? "bg-emerald-500 text-white" 
                      : isActive 
                        ? "bg-blue-600 text-white ring-4 ring-blue-100" 
                        : "bg-slate-100 text-slate-400"
                  }`}>
                    {isDone ? <CheckIcon className="h-4 w-4" /> : index + 1}
                  </div>
                  {index < timeline.length - 1 && (
                    <div className={`w-0.5 grow min-h-[30px] my-1 ${isDone ? "bg-emerald-200" : "bg-slate-100"}`} />
                  )}
                </div>
                <div className="pb-5 flex-1">
                  <p className={`text-sm font-semibold ${isTodo ? "text-slate-400" : "text-slate-800"}`}>
                    {step.label}
                  </p>
                  {step.time && (
                    <p className="mt-0.5 text-xs text-slate-500 font-medium font-sans">
                      {step.time}
                    </p>
                  )}
                  {step.comment && (
                    <div className="mt-1.5 rounded-xl bg-slate-50 border border-slate-100 p-2.5 text-xs text-slate-600 shadow-sm max-w-md">
                      {step.user && (
                        <span className="block font-bold text-slate-700 mb-0.5">
                          {step.user}:
                        </span>
                      )}
                      <p className="whitespace-pre-line leading-relaxed">{step.comment}</p>
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    const calculateMilestoneDates = (startDateVal, dueDateVal) => {
      if (!startDateVal || !dueDateVal) return {};
      const start = new Date(startDateVal + "T00:00:00");
      const due = new Date(dueDateVal + "T00:00:00");
      if (due <= start) return {};

      const D = due.getTime() - start.getTime();
      const pad = (n) => String(n).padStart(2, "0");
      const formatDate = (date) => {
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
      };

      return {
        "Khảo sát": formatDate(new Date(start.getTime() + D * 0.10)),
        "Đề xuất giải pháp": formatDate(new Date(start.getTime() + D * 0.30)),
        "Phê duyệt giải pháp": formatDate(new Date(start.getTime() + D * 0.40)),
        "Triển khai": formatDate(due),
      };
    };

    function CreateRequestModal({ compact, onClose, onSave }) {
      const getTodayStr = () => {
        const today = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        return `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
      };

      const getDueDateOffset = (startDateVal, priorityVal) => {
        if (!startDateVal) return "";
        const start = new Date(startDateVal + "T00:00:00");
        let offsetDays = 2;
        if (priorityVal === "Immediate") offsetDays = 0;
        else if (priorityVal === "Urgent") offsetDays = 1;
        else if (priorityVal === "High") offsetDays = 1;
        else if (priorityVal === "Normal") offsetDays = 2;
        else if (priorityVal === "Low") offsetDays = 4;

        const due = new Date(start.getTime() + offsetDays * 24 * 60 * 60 * 1000);
        const pad = (n) => String(n).padStart(2, "0");
        return `${due.getFullYear()}-${pad(due.getMonth() + 1)}-${pad(due.getDate())}`;
      };

      const todayStr = getTodayStr();
      const defaultDueDate = getDueDateOffset(todayStr, "Normal");
      const initialMilestones = calculateMilestoneDates(todayStr, defaultDueDate);

      const [form, setForm] = useState({
        project: "Hỗ trợ người dùng",
        tracker: "Sự cố / Lỗi nghiêm trọng",
        subject: "",
        description: "",
        isPrivate: false,
        status: "New",
        priority: "Normal",
        assignee: "",
        category: "",
        assignToMe: false,
        parentTask: "",
        startDate: todayStr,
        dueDate: defaultDueDate,
        estimatedTime: "",
        percentDone: "0",
        requestType: "Sự cố hệ thống",
        watchers: "",
        milestones: initialMilestones,
      });

      const change = (key, value) => {
        setForm((old) => {
          const updated = { ...old, [key]: value };
          if (key === "startDate" || key === "priority") {
            updated.dueDate = getDueDateOffset(updated.startDate, updated.priority);
            updated.milestones = calculateMilestoneDates(updated.startDate, updated.dueDate);
          } else if (key === "dueDate") {
            updated.milestones = calculateMilestoneDates(updated.startDate, updated.dueDate);
          }
          return updated;
        });
      };

      const changeMilestone = (stepLabel, value) => {
        setForm((old) => ({
          ...old,
          milestones: { ...old.milestones, [stepLabel]: value },
        }));
      };

      const FieldLabel = ({ children, required = false, hint = "" }) => (
        <div className="mb-1.5 flex items-center justify-between">
          <span className="text-sm font-semibold text-slate-700">{children}{required && <span className="ml-1 text-red-500">*</span>}</span>
          {hint && <span className="text-[11px] font-medium text-blue-500">{hint}</span>}
        </div>
      );

      const inputClass = "w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100";
      
      const DatePickerField = ({ value, onChange, placeholder }) => {
        const inputId = useMemo(() => `date-${Math.random().toString(36).slice(2)}`, []);
        return (
          <div className="relative">
            <input
              id={inputId}
              type="date"
              value={value}
              onChange={(e) => onChange(e.target.value)}
              className={`${inputClass} pr-12`}
              placeholder={placeholder}
            />
            <button
              type="button"
              onClick={() => {
                const input = document.getElementById(inputId);
                if (input?.showPicker) input.showPicker();
                else input?.focus();
              }}
              className="absolute right-2 top-1/2 flex h-8 w-8 -translate-y-1/2 items-center justify-center rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-100"
              aria-label="Chọn ngày"
            >
              <CalendarDaysIcon className="h-4 w-4" />
            </button>
          </div>
        );
      };

      return (
        <div className={`${compact ? "fixed" : "fixed"} inset-0 z-50 flex items-center justify-center modal-backdrop p-3`} onClick={onClose}>
          <div
            onClick={(event) => event.stopPropagation()}
            className={`overflow-y-auto rounded-2xl bg-white shadow-2xl ${compact ? "max-h-[calc(100vh-24px)] w-full" : "max-h-[90vh] w-[800px]"} transition-all`}
          >
            <div className="sticky top-0 z-10 flex items-center justify-between border-b border-slate-100 bg-white px-5 py-4">
              <div>
                <h2 className="text-lg font-bold text-slate-900">New issue</h2>
                <p className="mt-0.5 text-xs text-slate-500">Tạo yêu cầu theo form Redmine · Thời gian workflow phát sinh tự động</p>
              </div>
              <button onClick={onClose} className="rounded-lg p-2 hover:bg-slate-100"><XIcon className="h-5 w-5 text-slate-400" /></button>
            </div>

            <div className="space-y-4 p-5">
              <div className="grid gap-3 grid-cols-2">
                <label>
                  <FieldLabel required>Project</FieldLabel>
                  <select value={form.project} onChange={(e) => change("project", e.target.value)} className={inputClass}>
                    <option>Hỗ trợ người dùng</option>
                    <option>Operations &amp; Infrastructure</option>
                    <option>Product &amp; Development</option>
                    <option>System</option>
                  </select>
                </label>
                <label>
                  <FieldLabel required>Tracker</FieldLabel>
                  <select value={form.tracker} onChange={(e) => change("tracker", e.target.value)} className={inputClass}>
                    <option>Sự cố / Lỗi nghiêm trọng</option>
                    <option>Hỗ trợ phần mềm</option>
                    <option>Yêu cầu thay đổi</option>
                    <option>Cải tiến chức năng</option>
                  </select>
                </label>
              </div>

              <label className="block">
                <FieldLabel required>Subject</FieldLabel>
                <input value={form.subject} onChange={(e) => change("subject", e.target.value)} placeholder="Ví dụ: Không đăng nhập được LIS tại quầy tiếp nhận" className={inputClass} />
              </label>

              <label className="block">
                <FieldLabel>Description</FieldLabel>
                <div className="overflow-hidden rounded-xl border border-slate-200 focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-100">
                  <div className="flex flex-wrap items-center gap-1 border-b border-slate-100 bg-slate-50 px-2 py-2 text-xs font-semibold text-slate-500">
                    {["B", "I", "U", "S", "H1", "H2", "H3"].map((tool) => (
                      <span key={tool} className="rounded px-2 py-0.5 hover:bg-white cursor-pointer">{tool}</span>
                    ))}
                  </div>
                  <textarea value={form.description} onChange={(e) => change("description", e.target.value)} rows={4} placeholder="Mô tả tình trạng lỗi..." className="w-full resize-none px-3 py-2.5 text-sm outline-none" />
                </div>
              </label>

              <label className="flex items-center gap-2 text-sm text-slate-600 cursor-pointer">

    // --- Main Responsive App ---
    function App() {
      const [requests, setRequests] = useState(initialRequests);
      const [selectedId, setSelectedId] = useState(null);
      const [showCreate, setShowCreate] = useState(false);
      const [transitionContext, setTransitionContext] = useState(null);
      const [filters, setFilters] = useState({
        assignee: "Tất cả",
        progress: "Tất cả",
        sla: "Tất cả",
        project: "Tất cả",
        priority: "Tất cả",
        requestType: "Tất cả",
      });

      // State to track if it is mobile screen width (< 1024px)
      const [isMobile, setIsMobile] = useState(window.innerWidth < 1024);

      useEffect(() => {
        const handleResize = () => {
          setIsMobile(window.innerWidth < 1024);
        };
        window.addEventListener("resize", handleResize);
        return () => window.removeEventListener("resize", handleResize);
      }, []);

      const selected = useMemo(
        () => requests.find((r) => r.id === selectedId),
        [requests, selectedId]
      );

      const filteredRequests = useMemo(() => {
        return requests.filter((request) => {
          const progress = quickStatus(request);
          const slaMatch =
            filters.sla === "Tất cả" ||
            (filters.sla === "Quá hạn" && request.risk === "Quá hạn") ||
            (filters.sla === "Sắp quá hạn" && request.risk === "Có nguy cơ trễ hạn") ||
            (filters.sla === "Đúng hạn" && request.risk === "Đúng hạn");

          return (
            (filters.assignee === "Tất cả" || request.assignee === filters.assignee) &&
            (filters.progress === "Tất cả" || progress === filters.progress) &&
            slaMatch &&
            (filters.project === "Tất cả" || request.project === filters.project) &&
            (filters.priority === "Tất cả" || request.priority === filters.priority) &&
            (filters.requestType === "Tất cả" || request.requestType === filters.requestType)
          );
        });
      }, [requests, filters]);

      function createRequest(form) {
        const created = nowString();
        const id = `#${1029 + requests.length}`;
        const priorityMap = {
          Immediate: "25/05/2026 17:32",
          Urgent: "26/05/2026 11:32",
          High: "26/05/2026 15:32",
          Normal: "27/05/2026 17:00",
          Low: "29/05/2026 17:00",
        };
        const formatSelectedDate = (value, fallbackTime = "17:00") => {
          if (!value) return "";
          const [year, month, day] = value.split("-");
          return `${day}/${month}/${year} ${fallbackTime}`;
        };
        const due = formatSelectedDate(form.dueDate) || priorityMap[form.priority] || "27/05/2026 17:00";
        const assignedName = form.assignToMe ? "Tôi" : form.assignee || "Chưa phân công";

        let startVal = form.startDate;
        let dueVal = form.dueDate;

        if (startVal || dueVal) {
          if (!startVal) {
            const today = new Date();
            const pad = (n) => String(n).padStart(2, "0");
            startVal = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
          }
          if (!dueVal) {
            const startTemp = new Date(startVal + 'T08:00:00');
            const dueTemp = new Date(startTemp.getTime() + 2 * 24 * 60 * 60 * 1000);
            const pad = (n) => String(n).padStart(2, "0");
            dueVal = `${dueTemp.getFullYear()}-${pad(dueTemp.getMonth() + 1)}-${pad(dueTemp.getDate())}`;
          }
        }

        let calculatedTimeline;
        if (form.startDate && form.dueDate && form.milestones) {
          calculatedTimeline = steps.map((label, index) => {
            let stepTimeStr = "";
            if (label === "Tiếp nhận yêu cầu") {
              stepTimeStr = formatSelectedDate(form.startDate, "08:00");
            } else if (label === "Khảo sát") {
              stepTimeStr = formatSelectedDate(form.milestones["Khảo sát"], "09:30");
            } else if (label === "Đề xuất giải pháp") {
              stepTimeStr = formatSelectedDate(form.milestones["Đề xuất giải pháp"], "11:00");
            } else if (label === "Phê duyệt giải pháp") {
              stepTimeStr = formatSelectedDate(form.milestones["Phê duyệt giải pháp"], "14:30");
            } else if (label === "Triển khai") {
              stepTimeStr = formatSelectedDate(form.milestones["Triển khai"], "17:00");
            } else {
              stepTimeStr = formatSelectedDate(form.dueDate, "17:00");
            }

            return {
              label,
              state: index === 0 ? "done" : "todo",
              time: stepTimeStr,
            };
          });
        } else {
          calculatedTimeline = blankTimeline(created);
        }

        const request = {
          id,
          title: form.subject,
          project: form.project,
          requester: "Người dùng hiện tại",
          assignee: assignedName,
          created,
          due,
          priority: form.priority,
          sla: "Đã tự tính theo SLA",
          status: "Mới tiếp nhận",
          risk: "Đúng hạn",
          requestType: form.requestType,
          description: form.description || `Tracker: ${form.tracker} · Loại yêu cầu: ${form.requestType}`,
          approvedSolution: "Chưa có",
          timeline: calculatedTimeline,
        };
        setRequests((old) => [request, ...old]);
        setShowCreate(false);
      }

      function advanceStatus(id, actionLabel) {
        let label = actionLabel;
        if (!label) {
          const request = requests.find(r => r.id === id);
          const actionObj = request ? getNextAction(request) : null;
          label = actionObj ? actionObj.label : null;
        }
        if (label) {
          setTransitionContext({ requestId: id, actionType: label });
        }
      }

      function handleTransitionSubmit(id, actionType, formData) {
        setRequests((old) =>
          old.map((request) => {
            if (request.id !== id) return request;

            const now = nowString();
            let newStatus = request.status;
            let newTimeline = [...request.timeline];
            let newAssignee = request.assignee;
            let newApprovedSolution = request.approvedSolution;

            if (actionType === "Bắt đầu khảo sát") {
              newStatus = "Đang khảo sát";
              newAssignee = formData.assignee || request.assignee;
              newTimeline = newTimeline.map(step => {
                if (step.label === "Khảo sát") return { 
                  ...step, 
                  state: "active", 
                  time: `Bắt đầu ${now}`, 
                  comment: formData.notes, 
                  user: "IT Helpdesk" 
                };
                return step;
              });
            } else if (actionType === "Đề xuất giải pháp") {
              newStatus = "Chờ phê duyệt";
              newAssignee = formData.assignee || request.assignee;
              newApprovedSolution = formData.solution || "Đã đề xuất giải pháp";
              newTimeline = newTimeline.map(step => {
                if (step.label === "Khảo sát") return { ...step, state: "done" };
                if (step.label === "Đề xuất giải pháp") return { 
                  ...step, 
                  state: "active", 
                  time: `Đề xuất: ${now}`, 
                  comment: formData.solution, 
                  user: "IT Helpdesk" 
                };
                return step;
              });
            } else if (actionType === "Phê duyệt giải pháp") {
              const isApproved = formData.decision !== "Từ chối";
              if (isApproved) {
                newTimeline = newTimeline.map(step => {
                  if (step.label === "Đề xuất giải pháp") return { ...step, state: "done" };
                  if (step.label === "Phê duyệt giải pháp") return { 
                    ...step, 
                    state: "active", 
                    time: `Phê duyệt: ${now}`, 
                    comment: formData.notes, 
                    user: "Trần Bình" 
                  };
                  return step;
                });
              } else {
                newStatus = "Đang khảo sát";
                newTimeline = newTimeline.map(step => {
                  if (step.label === "Khảo sát") return { ...step, state: "active", time: `Yêu cầu làm lại: ${now}` };
                  if (step.label === "Đề xuất giải pháp") return { ...step, state: "todo", comment: `Bị từ chối: ${formData.notes}`, user: "Trần Bình", time: "" };
                  if (step.label === "Phê duyệt giải pháp") return { ...step, state: "todo", time: "" };
                  return step;
                });
              }
            } else if (actionType === "Bắt đầu triển khai") {
              newStatus = "Đang triển khai";
              newAssignee = formData.assignee || request.assignee;
              newTimeline = newTimeline.map(step => {
                if (step.label === "Phê duyệt giải pháp") return { ...step, state: "done" };
                if (step.label === "Triển khai") return { 
                  ...step, 
                  state: "active", 
                  time: `Bắt đầu ${now}`, 
                  comment: formData.notes, 
                  user: request.assignee 
                };
                return step;
              });
            } else if (actionType === "Hoàn tất yêu cầu (Đóng)" || actionType === "Hoàn tất yêu cầu") {
              newStatus = "Đã đóng";
              newTimeline = newTimeline.map(step => {
                if (step.label === "Triển khai") return { ...step, state: "done" };
                if (step.label === "Kết thúc") return { 
                  ...step, 
                  state: "done", 
                  time: now, 
                  comment: formData.notes, 
                  user: request.assignee 
                };
                return step;
              });
            }

            return {
              ...request,
              status: newStatus,
              assignee: newAssignee,
              approvedSolution: newApprovedSolution,
              timeline: newTimeline,
              sla: newStatus === "Đã đóng" ? "Đã đóng đúng quy trình" : request.sla
            };
          })
        );
        setTransitionContext(null);
      }

      if (isMobile) {
        return (
          <div className="min-h-screen bg-slate-50 text-slate-900 relative flex flex-col font-sans">
            <Header compact={true} onCreate={() => setShowCreate(true)} />
            {!selected ? (
              <div className="flex-1 flex flex-col pb-6">
                <FilterBar compact={true} filters={filters} setFilters={setFilters} resultCount={filteredRequests.length} />
                <div className="grid gap-3 px-4">
                  {filteredRequests.map((request) => (
                    <RequestCard
                      key={request.id}
                      request={request}
                      onOpen={(item) => setSelectedId(item.id)}
                      onAdvance={advanceStatus}
                    />
                  ))}
                </div>
              </div>
            ) : (
              <DetailView
                request={selected}
                compact={true}
                onBack={() => setSelectedId(null)}
                onAdvance={advanceStatus}
              />
            )}

            {showCreate && (
              <CreateRequestModal compact={true} onClose={() => setShowCreate(false)} onSave={createRequest} />
            )}

            {transitionContext && (
              <TransitionModal 
                context={transitionContext} 
                onClose={() => setTransitionContext(null)} 
                onSubmit={handleTransitionSubmit} 
                compact={true}
              />
            )}
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-100 flex p-0 lg:p-6 justify-center items-stretch font-sans text-slate-900">
          <div className="w-full max-w-[1260px] bg-slate-50 rounded-2xl overflow-hidden border border-slate-200 shadow-xl flex">
            <DesktopSidebar />
            <main className="min-w-0 flex-1 flex flex-col overflow-y-auto">
              <Header compact={false} onCreate={() => setShowCreate(true)} />
              
              {!selected ? (
                <div className="flex-1 flex flex-col">
                  <FilterBar compact={false} filters={filters} setFilters={setFilters} resultCount={filteredRequests.length} />
                  <div className="grid gap-3 pb-6 grid-cols-1 px-7 xl:grid-cols-2">
                    {filteredRequests.map((request) => (
                      <RequestCard
                        key={request.id}
                        request={request}
                        onOpen={(item) => setSelectedId(item.id)}
                        onAdvance={advanceStatus}
                      />
                    ))}
                  </div>
                </div>
              ) : (
                <DetailView
                  request={selected}
                  compact={false}
                  onBack={() => setSelectedId(null)}
                  onAdvance={advanceStatus}
                />
              )}
            </main>

            {showCreate && (
              <CreateRequestModal compact={false} onClose={() => setShowCreate(false)} onSave={createRequest} />
            )}

            {transitionContext && (
              <TransitionModal 
                context={transitionContext} 
                onClose={() => setTransitionContext(null)} 
                onSubmit={handleTransitionSubmit} 
                compact={false}
              />
            )}
          </div>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
